# Demonstração local (D-051): serve o build estático e encaminha a API para
# o serviço `backend` da composição docker-compose.demo.yml — a aplicação
# fica toda num único endereço (http://localhost:8080), sem CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança (docs/ANALISE_OP_PM.md, M2). Repetidos nos
    # blocos com add_header próprio, porque o nginx não herda add_header
    # para um location que defina os seus. CSP fica para quando o motor de
    # cabos deixar de ser executado via blob: (ver M2).
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ ^/api/projects/[^/]+/photo$ {
        client_max_body_size 11m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        # Documentos do inventário até 25 MB (o backend aplica os limites reais).
        client_max_body_size 26m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /me {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Documentação interativa da API (Swagger) — útil na demonstração. O
    # backend só a serve com API_DOCS_ENABLED (fechada com DEMO_REAL_DATA=true).
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
