# Variante com proxy (demonstração local D-051 e produção Tailscale): serve o
# build estático e encaminha a API para o serviço `backend` da composição —
# a aplicação fica toda numa única origem, sem CORS. Escolhe-se com
# `--build-arg NGINX_CONF=docker/nginx.proxy.conf` (ver frontend/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança + CSP (ver security-*.conf, copiados para
    # /etc/nginx/snippets na imagem). Repetidos em cada location com
    # add_header próprio, porque o nginx não herda add_header para esses.
    server_tokens off;
    include snippets/security-base.conf;
    include snippets/security-csp.conf;

    location ~ ^/api/projects/[^/]+/photo$ {
        client_max_body_size 11m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        # Documentos do inventário até 25 MB (o backend aplica os limites reais).
        client_max_body_size 26m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /me {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Documentação interativa da API (Swagger) — útil na demonstração. O
    # backend só a serve com API_DOCS_ENABLED (fechada com DEMO_REAL_DATA=true).
    # O Swagger UI traz scripts/estilos inline e vai buscar recursos a uma CDN:
    # fica fora da CSP da aplicação (mantém só os cabeçalhos base).
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        include snippets/security-base.conf;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        include snippets/security-base.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/security-base.conf;
        include snippets/security-csp.conf;
    }

    # Sem hash no nome (public/): revalidar sempre.
    location = /theme-bootstrap.js {
        add_header Cache-Control "no-cache";
        include snippets/security-base.conf;
        include snippets/security-csp.conf;
    }

    # Web Worker do motor de cabos: CSP própria (sem rede; 'unsafe-eval' só aqui).
    location = /cable-engine-worker.js {
        add_header Cache-Control "no-cache";
        include snippets/security-base.conf;
        include snippets/security-csp-worker.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/security-base.conf;
        include snippets/security-csp.conf;
    }
}
