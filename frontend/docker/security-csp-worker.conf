# CSP do Web Worker do motor de cabos (/cable-engine-worker.js). Um worker
# carregado de uma URL tem a CSP da sua própria resposta (não a da página):
# - connect-src 'none': o motor não tem rede (imposto pelo browser);
# - script-src 'unsafe-eval': o worker executa o script do motor (privado, vindo
#   da API, com SHA-256 verificado) com eval indireto. Fica confinado a este
#   worker, que não vê o DOM nem os tokens MSAL; a página mantém script-src 'self';
# - default-src/worker-src 'none': nada mais (sem sub-workers).
add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-eval'; connect-src 'none'; worker-src 'none'" always;
