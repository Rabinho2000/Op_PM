# CSP da página do motor de cabos (/cable-engine-frame.html), que corre num
# <iframe sandbox="allow-scripts"> (origem opaca). Um iframe carregado de uma URL
# tem a CSP da sua própria resposta (não a da página):
# - default-src 'none' e connect-src 'none': o motor não tem rede nem recursos
#   externos (imposto pelo browser);
# - script-src 'self' 'unsafe-eval': carrega /cable-engine-frame.js e executa o
#   script do motor (privado, vindo da API, com SHA-256 verificado) com eval
#   indireto. Fica confinado a este iframe, que não vê o DOM nem os tokens MSAL;
#   a página mantém script-src 'self';
# - img-src data: blob: e style-src 'unsafe-inline': o motor rasteriza o
#   esquema SVG num <canvas> (PNG/PDF/DOCX) e injeta estilos;
# - frame-ancestors 'self': só a nossa aplicação o pode incluir (a página tem
#   X-Frame-Options DENY; esta é a única exceção, por isso leva SAMEORIGIN).
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; img-src data: blob:; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000" always;
