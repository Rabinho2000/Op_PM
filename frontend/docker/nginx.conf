# Serve o build estático (Vite) com fallback de SPA -- react-router-dom
# usa routing do lado do cliente, por isso qualquer caminho desconhecido
# tem de devolver index.html (não 404) para o router assumir o resto.
#
# Variante "estática" (staging): a API fica noutra origem (VITE_API_BASE_URL
# absoluto), por isso não há proxy aqui. A variante com proxy de /api é
# nginx.proxy.conf (demonstração e produção Tailscale). Escolhe-se com
# `--build-arg NGINX_CONF=docker/<ficheiro>` (ver frontend/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança + CSP (ver security-*.conf, copiados para
    # /etc/nginx/snippets na imagem). Repetidos em cada location com
    # add_header próprio, porque o nginx não herda add_header para esses.
    server_tokens off;
    include snippets/security-base.conf;
    include snippets/security-csp.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ativos com hash no nome (Vite) podem ficar cacheados de forma
    # agressiva; index.html nunca (para uma nova versão ser sempre
    # servida sem esperar por expiração de cache de browser).
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/security-base.conf;
        include snippets/security-csp.conf;
    }

    # Sem hash no nome (public/): revalidar sempre.
    location = /theme-bootstrap.js {
        add_header Cache-Control "no-cache";
        include snippets/security-base.conf;
        include snippets/security-csp.conf;
    }

    # Motor de cabos: página + script do iframe isolado, com CSP própria (sem rede;
    # 'unsafe-eval' só aqui) e SAMEORIGIN (a única página que pode ser embebida).
    location = /cable-engine-frame.html {
        add_header Cache-Control "no-cache";
        include snippets/security-csp-frame.conf;
    }

    location = /cable-engine-frame.js {
        add_header Cache-Control "no-cache";
        include snippets/security-base.conf;
        include snippets/security-csp.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/security-base.conf;
        include snippets/security-csp.conf;
    }
}
