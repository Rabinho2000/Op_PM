# Serve o build estático (Vite) com fallback de SPA -- react-router-dom
# usa routing do lado do cliente, por isso qualquer caminho desconhecido
# tem de devolver index.html (não 404) para o router assumir o resto.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ativos com hash no nome (Vite) podem ficar cacheados de forma
    # agressiva; index.html nunca (para uma nova versão ser sempre
    # servida sem esperar por expiração de cache de browser).
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
