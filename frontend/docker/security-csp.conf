# Content-Security-Policy da aplicação (docs/ANALISE_OP_PM.md, M2 / Fase 2).
#
# - script-src 'self': nada de scripts inline, de eval nem de blob:. O motor de
#   cabos (privado, vindo da API) corre num Web Worker ESTÁTICO
#   (/cable-engine-worker.js, `worker-src 'self'`), que recebe o script por
#   mensagem; esse ficheiro tem a sua própria CSP (security-csp-worker.conf:
#   sem rede, 'unsafe-eval' só ali) e não vê o DOM nem o sessionStorage (tokens
#   MSAL). Ver frontend/src/features/cables/engineWorker/.
# - connect-src: a própria origem + Microsoft Entra ID (MSAL: login, token,
#   descoberta OpenID). __CONNECT_EXTRA__ é substituído no build do Docker
#   pela origem da API quando VITE_API_BASE_URL é absoluto (API noutra origem).
# - img-src: logótipo da Solcor (solcor.pt, com símbolo SVG de recurso),
#   fotografias/PDF por blob: e os tiles do mapa operacional (Leaflet carrega-os
#   como <img>, por isso é img-src e não connect-src). Produção:
#   MAP_TILE_URL=https://tile.openstreetmap.org/{z}/{x}/{y}.png. Outro fornecedor
#   de tiles => acrescentar aqui o seu domínio.
# - font-src 'self' data:: o Vite embute como data: as fontes pequenas (subsets).
# - style-src 'self' 'unsafe-inline': só para estilos (nunca scripts). É
#   preciso porque a pré-visualização do email do relatório de cliente
#   (<iframe srcdoc>) e a ficha de segurança impressa (janela about:blank)
#   herdam esta política e trazem <style>/style="" do servidor.
# - frame-ancestors 'none', base-uri/form-action 'self', object-src 'none'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self' https://login.microsoftonline.com __CONNECT_EXTRA__; img-src 'self' data: blob: https://www.solcor.pt https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
