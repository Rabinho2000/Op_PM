name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-sqlite:
    # Rápido, sem serviços externos — o que um dev corre localmente por
    # omissão (ver backend/.env.example, docs/DECISIONS.md D-002).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///./data/ci_op_pm.db"
      # Declarado explicitamente (mesmo aqui, onde já se sabe que é
      # SQLite) para simetria com o job PostgreSQL abaixo e para que
      # tests/test_database_dialect.py também corra aqui, não só lá.
      EXPECTED_DB_DIALECT: "sqlite"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Aplicar migrações (SQLite local, sem dados reais)
        run: python -m alembic upgrade head
      - name: Testes
        run: python -m pytest -q

  backend-postgres:
    # Valida contra o motor de produção-alvo (docs/ARCHITECTURE_PROPOSAL.md)
    # — sobretudo `batch_alter_table` nas migrações, `Numeric` e `GUID`
    # (D-021). Não removido nem substituído pelo job SQLite acima; os dois
    # correm sempre em paralelo.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: op_pm
          POSTGRES_PASSWORD: op_pm_ci_only
          POSTGRES_DB: op_pm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U op_pm -d op_pm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql+psycopg://op_pm:op_pm_ci_only@localhost:5432/op_pm_ci"
      # Lido por tests/conftest.py::_prepare_database (pytest.exit duro,
      # antes de qualquer teste correr) e por
      # tests/test_database_dialect.py — a dupla garantia de que este job
      # nunca pode passar silenciosamente contra SQLite (D-022). A causa
      # raiz que isto protege: conftest.py costumava sobrescrever sempre
      # DATABASE_URL com um SQLite temporário, ignorando este valor.
      EXPECTED_DB_DIALECT: "postgresql"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências (incl. driver PostgreSQL)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-postgres.txt
      - name: Confirmar ligação real ao PostgreSQL antes de migrar
        # Verificação independente das duas de cima, escrita diretamente
        # no workflow para ser auditável só de olhar para este ficheiro,
        # sem precisar de correr Python nenhum: falha o job já aqui se
        # DATABASE_URL não apontar para PostgreSQL.
        run: |
          python -c "
          import os
          url = os.environ['DATABASE_URL']
          assert url.startswith('postgresql'), f'DATABASE_URL nao aponta para PostgreSQL: {url!r}'
          print('DATABASE_URL confirmado como PostgreSQL:', url)
          "
      - name: Aplicar migrações (PostgreSQL, sem dados reais)
        run: python -m alembic upgrade head
      - name: Testes
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-build:
    # Valida que backend/Dockerfile e frontend/Dockerfile constroem, e que
    # docker-compose.staging.example.yml é sintaticamente válido (D-050) —
    # não foi possível validar isto localmente sem Docker disponível no
    # ambiente onde estes ficheiros foram escritos. Só confirma que os
    # builds/a composição funcionam; não sobe nenhum container, não corre
    # HEALTHCHECK, não precisa de PostgreSQL real. Todos os valores abaixo
    # (ARGs, .env temporário) são placeholders óbvios gerados só para este
    # job — nunca segredos nem dados reais, e nunca commitados (o .env
    # temporário é apagado no fim do job, dentro do runner efémero do CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build — backend
        run: docker build -t op_pm-backend:ci ./backend
      - name: docker build — frontend (com placeholders óbvios, nunca segredos reais)
        run: |
          docker build -t op_pm-frontend:ci \
            --build-arg VITE_API_BASE_URL=https://backend.staging.invalid \
            --build-arg VITE_ENTRA_CLIENT_ID=00000000-0000-0000-0000-000000000000 \
            --build-arg VITE_ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000 \
            --build-arg VITE_ENTRA_API_SCOPE=api://00000000-0000-0000-0000-000000000000/access_as_user \
            ./frontend
      - name: docker build — frontend de demonstração (Dockerfile.demo)
        run: docker build -f frontend/Dockerfile.demo -t op_pm-frontend-demo:ci ./frontend
      - name: Validar docker-compose.staging.example.yml (config, sem subir containers)
        run: |
          cat > backend/.env <<'EOF'
          APP_ENV=staging
          SECRET_KEY=ci-only-placeholder-never-a-real-secret
          DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/ci
          AUTH_ENABLED=true
          ENTRA_VALIDATION_MODE=real
          ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000
          ENTRA_CLIENT_ID=00000000-0000-0000-0000-000000000000
          ENTRA_REQUIRED_SCOPE=access_as_user
          CORS_ALLOWED_ORIGINS=https://frontend.staging.invalid
          EOF
          VITE_API_BASE_URL=https://backend.staging.invalid \
          VITE_ENTRA_CLIENT_ID=00000000-0000-0000-0000-000000000000 \
          VITE_ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000 \
          VITE_ENTRA_API_SCOPE=api://00000000-0000-0000-0000-000000000000/access_as_user \
            docker compose -f docker-compose.staging.example.yml config --quiet
          rm -f backend/.env

  demo-smoke:
    # Demonstração local (D-051): constrói e arranca docker-compose.demo.yml
    # de verdade (só dados sintéticos, sem PostgreSQL nem credenciais) e
    # confirma que o frontend responde, que a API é servida pela mesma
    # origem, que o seed sintético foi aplicado e que o login de
    # demonstração funciona. Não foi possível correr Docker no ambiente
    # onde isto foi escrito — este job é a validação real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.demo.yml (config)
        run: docker compose -f docker-compose.demo.yml config --quiet
      - name: Construir e arrancar a demonstração
        run: |
          docker compose -f docker-compose.demo.yml up --build -d
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then echo "demo pronta"; exit 0; fi
            sleep 2
          done
          echo "a demonstração não respondeu a tempo"; exit 1
      - name: Verificar frontend, API e dados sintéticos
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/projects | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/health | tee /tmp/health.json
          python3 -c "import json; h=json.load(open('/tmp/health.json')); assert h['app_env']=='local' and h['demo_mode'] and h['dev_login_available'], h"
          curl -fsS -H 'X-Dev-User-Email: chefe.sintetico@example.invalid'             http://127.0.0.1:8080/api/dashboard/summary > /tmp/summary.json
          python3 -c "import json; s=json.load(open('/tmp/summary.json')); assert s['active_projects_count'] >= 20, s['active_projects_count']; assert s['projects_photos_pending'] and len(s['week_overview']) == 7; print('projetos ativos:', s['active_projects_count'])"
          # Percurso de obra (D-052): 18 etapas com progresso sintético.
          PID=$(curl -fsS -H 'X-Dev-User-Email: chefe.sintetico@example.invalid' http://127.0.0.1:8080/api/projects | python3 -c "import json,sys; print(next(p['id'] for p in json.load(sys.stdin) if p['name'].startswith('Escola Sintética')))")
          curl -fsS -H 'X-Dev-User-Email: chefe.sintetico@example.invalid' "http://127.0.0.1:8080/api/projects/$PID/workflow" > /tmp/workflow.json
          python3 -c "import json; w=json.load(open('/tmp/workflow.json')); assert len(w['stages'])==18 and len(w['phases'])==6 and w['done_count']>0, (len(w['stages']), w['done_count']); print('percurso:', w['progress_percent'], '%')"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/api/projects/$PID/workflow")" = "401"
          # Sem cabeçalho de desenvolvimento, a API recusa.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/dashboard/summary)" = "401"
      - name: Idempotência — reiniciar não duplica dados
        run: |
          set -euo pipefail
          docker compose -f docker-compose.demo.yml up -d --force-recreate
          sleep 5
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1 && break
            sleep 2
          done
          test "$(docker compose -f docker-compose.demo.yml ps -a --format '{{.Service}} {{.ExitCode}}' | awk '$1=="demo-setup"{print $2}')" = "0"
          curl -fsS -H 'X-Dev-User-Email: chefe.sintetico@example.invalid'             http://127.0.0.1:8080/api/projects > /tmp/projects.json
          python3 -c "import json,collections; p=json.load(open('/tmp/projects.json')); c=collections.Counter(x['name'] for x in p); d=[n for n,k in c.items() if k>1]; assert not d, d; print(len(p), 'projetos, sem duplicados')"
      - name: Registos em caso de falha
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs
      - name: Parar
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
