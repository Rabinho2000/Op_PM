# mypy gradual (M9): só os módulos listados em `files`. Os restantes
# módulos importados são seguidos mas o seu ruído não é reportado
# (follow_imports = silent). Alargar `files` à medida que o código for
# ficando tipado. Corre-se a partir de backend/:
#   mypy
[mypy]
python_version = 3.12
files = app/security, app/services/client_reports.py, app/services/client_report_scheduler.py
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
